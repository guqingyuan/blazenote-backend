name = "blazenote-backend"
main = "src/index.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "DB"
database_name = "blazenote"
database_id = "f6174225-2e71-45e6-8889-ad6ba234a4d4"
migrations_dir = "./migrations"

# [ai]
# binding = "AI"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "blazenote"
preview_bucket_name = "dev-blazenote"

[observability.logs]
enabled = true
